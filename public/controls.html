<!DOCTYPE html>
<html>
<head>
  <title>Reactor Controls</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100vh;
      overflow: hidden;
      touch-action: none;  /* prevent pull-to-refresh and zoom */
    }
    body {
      background: #0a0e14;
      color: #e0e0e0;
      font-family: -apple-system, sans-serif;
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }
    h1 {
      font-size: 28px;
      font-weight: 300;
      color: #4dd0e1;
      letter-spacing: 2px;
    }
    .controlsGrid {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;
      gap: 30px;
      flex: 1;
    }
    .panel {
      background: #141a23;
      border: 1px solid #2a3441;
      border-radius: 16px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      user-select: none;
    }
    .label {
      font-size: 14px;
      letter-spacing: 3px;
      color: #6b7888;
      text-transform: uppercase;
    }
    .value {
      font-size: 56px;
      font-weight: 200;
      color: #4dd0e1;
    }
    .unit { font-size: 18px; color: #6b7888; }

    /* Custom slider — easier to touch than native */
    .sliderContainer {
      width: 100%;
      height: 80px;
      background: #1f2630;
      border-radius: 40px;
      position: relative;
      cursor: pointer;
      touch-action: none;
    }
    .sliderTrack {
      position: absolute;
      top: 50%;
      left: 30px;
      right: 30px;
      height: 6px;
      background: #2a3441;
      border-radius: 3px;
      transform: translateY(-50%);
    }
    .sliderFill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: #4dd0e1;
      border-radius: 3px;
    }
    .sliderThumb {
      position: absolute;
      top: 50%;
      width: 70px;
      height: 70px;
      background: #4dd0e1;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 25px rgba(77, 208, 225, 0.6);
      pointer-events: none;
    }

    /* Knob */
    .knob {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #2a3441, #141a23);
      border: 3px solid #4dd0e1;
      position: relative;
      cursor: pointer;
      touch-action: none;
      box-shadow: 0 0 30px rgba(77, 208, 225, 0.2);
      user-select: none;
    }
    .knob::after {
      content: '';
      position: absolute;
      top: 8px;
      left: 50%;
      width: 4px;
      height: 30px;
      background: #4dd0e1;
      transform: translateX(-50%);
      border-radius: 2px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <h1>BIOREACTOR CONTROLS</h1>

  <div class="controlsGrid">
    <!-- RPM Slider (custom-built for touch reliability) -->
    <div class="panel">
      <div class="label">RPM</div>
      <div class="value"><span id="rpmValue">200</span></div>
      <div class="sliderContainer" id="rpmSlider">
        <div class="sliderTrack">
          <div class="sliderFill" id="rpmFill"></div>
        </div>
        <div class="sliderThumb" id="rpmThumb"></div>
      </div>
    </div>

    <!-- Viscosity Knob -->
    <div class="panel">
      <div class="label">Viscosity</div>
      <div class="knob" id="viscosityKnob" data-min="0.5" data-max="10" data-value="1.0"></div>
      <div class="value"><span id="viscosityValue">1.0</span><span class="unit"> cP</span></div>
    </div>

    <!-- Aeration Knob -->
    <div class="panel">
      <div class="label">Aeration</div>
      <div class="knob" id="aerationKnob" data-min="0" data-max="2" data-value="0.5"></div>
      <div class="value"><span id="aerationValue">0.5</span><span class="unit"> vvm</span></div>
    </div>
  </div>

  <script>
    const ws = new WebSocket(`ws://${location.host}`);
    let state = { rpm: 200, viscosity: 1.0, aeration: 0.5 };

    function sendState() {
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(state));
      }
    }

    // ============ CUSTOM SLIDER (works with both mouse + touch) ============
    const sliderEl = document.getElementById('rpmSlider');
    const fillEl = document.getElementById('rpmFill');
    const thumbEl = document.getElementById('rpmThumb');
    const rpmValueEl = document.getElementById('rpmValue');

    const RPM_MIN = 0, RPM_MAX = 600;

    function updateSliderUI(value) {
      const pct = (value - RPM_MIN) / (RPM_MAX - RPM_MIN);
      const containerRect = sliderEl.getBoundingClientRect();
      const trackPadding = 30;
      const trackWidth = containerRect.width - (trackPadding * 2);
      const thumbX = trackPadding + (pct * trackWidth);
      thumbEl.style.left = `${thumbX}px`;
      fillEl.style.width = `${pct * 100}%`;
      rpmValueEl.textContent = Math.round(value);
    }

    function setRpmFromTouch(clientX) {
      const rect = sliderEl.getBoundingClientRect();
      const trackPadding = 30;
      const x = clientX - rect.left - trackPadding;
      const trackWidth = rect.width - (trackPadding * 2);
      const pct = Math.max(0, Math.min(1, x / trackWidth));
      const value = RPM_MIN + pct * (RPM_MAX - RPM_MIN);
      state.rpm = Math.round(value);
      updateSliderUI(state.rpm);
      sendState();
    }

    let sliderDragging = false;

    // Use pointer events — unified mouse + touch handling
    sliderEl.addEventListener('pointerdown', (e) => {
      sliderDragging = true;
      sliderEl.setPointerCapture(e.pointerId);
      setRpmFromTouch(e.clientX);
      e.preventDefault();
    });

    sliderEl.addEventListener('pointermove', (e) => {
      if (!sliderDragging) return;
      setRpmFromTouch(e.clientX);
      e.preventDefault();
    });

    sliderEl.addEventListener('pointerup', (e) => {
      sliderDragging = false;
      sliderEl.releasePointerCapture(e.pointerId);
    });

    sliderEl.addEventListener('pointercancel', () => {
      sliderDragging = false;
    });

    // Init slider position
    requestAnimationFrame(() => updateSliderUI(state.rpm));

    // ============ KNOBS (drag up/down) ============
    function setupKnob(knobEl, valueEl, stateKey, decimals = 1) {
      const min = parseFloat(knobEl.dataset.min);
      const max = parseFloat(knobEl.dataset.max);
      let value = parseFloat(knobEl.dataset.value);

      function updateRotation() {
        const angle = -135 + ((value - min) / (max - min)) * 270;
        knobEl.style.transform = `rotate(${angle}deg)`;
        valueEl.textContent = value.toFixed(decimals);
      }

      let startY = 0;
      let startValue = 0;
      let dragging = false;

      knobEl.addEventListener('pointerdown', (e) => {
        dragging = true;
        startY = e.clientY;
        startValue = value;
        knobEl.setPointerCapture(e.pointerId);
        e.preventDefault();
      });

      knobEl.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const deltaY = startY - e.clientY;  // up = increase
        const range = max - min;
        const newValue = startValue + (deltaY / 150) * range;
        value = Math.max(min, Math.min(max, newValue));
        updateRotation();
        state[stateKey] = parseFloat(value.toFixed(decimals));
        sendState();
        e.preventDefault();
      });

      knobEl.addEventListener('pointerup', (e) => {
        dragging = false;
        knobEl.releasePointerCapture(e.pointerId);
      });

      knobEl.addEventListener('pointercancel', () => {
        dragging = false;
      });

      updateRotation();
    }

    setupKnob(
      document.getElementById('viscosityKnob'),
      document.getElementById('viscosityValue'),
      'viscosity', 1
    );
    setupKnob(
      document.getElementById('aerationKnob'),
      document.getElementById('aerationValue'),
      'aeration', 1
    );

    // Listen for state updates from server
    ws.onmessage = (event) => {
      const s = JSON.parse(event.data);
      if (s.rpm !== undefined && !sliderDragging) {
        state.rpm = s.rpm;
        updateSliderUI(s.rpm);
      }
    };
  </script>
</body>
</html>
