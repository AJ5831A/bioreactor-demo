<!DOCTYPE html>
<html>
<head>
  <title>Reactor Controls</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      height: 100vh;
      background: #0a0e14;
      color: #e0e0e0;
      font-family: -apple-system, sans-serif;
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }
    h1 {
      font-size: 28px;
      font-weight: 300;
      color: #4dd0e1;
      letter-spacing: 2px;
    }
    .controlsGrid {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;
      gap: 30px;
      flex: 1;
    }
    .panel {
      background: #141a23;
      border: 1px solid #2a3441;
      border-radius: 16px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }
    .label {
      font-size: 14px;
      letter-spacing: 3px;
      color: #6b7888;
      text-transform: uppercase;
    }
    .value {
      font-size: 56px;
      font-weight: 200;
      color: #4dd0e1;
    }
    .unit { font-size: 18px; color: #6b7888; }

    /* RPM Slider */
    input[type="range"] {
      width: 100%;
      height: 50px;
      -webkit-appearance: none;
      background: #1f2630;
      border-radius: 25px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 60px;
      height: 60px;
      background: #4dd0e1;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(77, 208, 225, 0.5);
    }

    /* Knob */
    .knob {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #2a3441, #141a23);
      border: 3px solid #4dd0e1;
      position: relative;
      cursor: pointer;
      touch-action: none;
      box-shadow: 0 0 30px rgba(77, 208, 225, 0.2);
    }
    .knob::after {
      content: '';
      position: absolute;
      top: 8px;
      left: 50%;
      width: 4px;
      height: 30px;
      background: #4dd0e1;
      transform: translateX(-50%);
      border-radius: 2px;
      transform-origin: 50% 60px;
    }
  </style>
</head>
<body>
  <h1>BIOREACTOR CONTROLS</h1>

  <div class="controlsGrid">
    <!-- RPM Slider -->
    <div class="panel">
      <div class="label">RPM</div>
      <div class="value"><span id="rpmValue">200</span></div>
      <input type="range" min="0" max="600" value="200" id="rpmSlider">
    </div>

    <!-- Viscosity Knob -->
    <div class="panel">
      <div class="label">Viscosity</div>
      <div class="knob" id="viscosityKnob" data-min="0.5" data-max="10" data-value="1.0"></div>
      <div class="value"><span id="viscosityValue">1.0</span><span class="unit"> cP</span></div>
    </div>

    <!-- Aeration Knob -->
    <div class="panel">
      <div class="label">Aeration</div>
      <div class="knob" id="aerationKnob" data-min="0" data-max="2" data-value="0.5"></div>
      <div class="value"><span id="aerationValue">0.5</span><span class="unit"> vvm</span></div>
    </div>
  </div>

  <script>
    const ws = new WebSocket(`ws://${location.host}`);
    let state = { rpm: 200, viscosity: 1.0, aeration: 0.5 };

    function sendState() {
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(state));
      }
    }

    // --- RPM slider ---
    const rpmSlider = document.getElementById('rpmSlider');
    const rpmValue = document.getElementById('rpmValue');
    rpmSlider.addEventListener('input', () => {
      state.rpm = parseInt(rpmSlider.value);
      rpmValue.textContent = state.rpm;
      sendState();
    });

    // --- Knob behavior (drag up/down to change value) ---
    function setupKnob(knobEl, valueEl, stateKey, decimals = 1) {
      const min = parseFloat(knobEl.dataset.min);
      const max = parseFloat(knobEl.dataset.max);
      let value = parseFloat(knobEl.dataset.value);

      function updateRotation() {
        // Map value to rotation (-135deg to +135deg, 270deg sweep)
        const pct = (value - min) / (max - min);
        const deg = -135 + pct * 270;
        knobEl.style.setProperty('--rot', `${deg}deg`);
        knobEl.querySelector ? null : null;
        // We need to set rotation on the ::after pseudo element via CSS variable trick
        knobEl.style.transform = '';
        knobEl.style.setProperty('--knob-rot', `${deg}deg`);
      }

      let startY = 0, startValue = 0, dragging = false;

      const onStart = (e) => {
        dragging = true;
        startY = (e.touches ? e.touches[0].clientY : e.clientY);
        startValue = value;
        e.preventDefault();
      };
      const onMove = (e) => {
        if (!dragging) return;
        const y = (e.touches ? e.touches[0].clientY : e.clientY);
        const deltaY = startY - y;  // up = increase
        const range = max - min;
        const newValue = startValue + (deltaY / 200) * range;
        value = Math.max(min, Math.min(max, newValue));
        valueEl.textContent = value.toFixed(decimals);
        // Rotate the indicator using inline rotation on a child
        const angle = -135 + ((value - min) / (max - min)) * 270;
        knobEl.style.transform = `rotate(${angle}deg)`;
        state[stateKey] = parseFloat(value.toFixed(decimals));
        sendState();
      };
      const onEnd = () => { dragging = false; };

      knobEl.addEventListener('mousedown', onStart);
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onEnd);
      knobEl.addEventListener('touchstart', onStart);
      document.addEventListener('touchmove', onMove, { passive: false });
      document.addEventListener('touchend', onEnd);
    }

    setupKnob(
      document.getElementById('viscosityKnob'),
      document.getElementById('viscosityValue'),
      'viscosity', 1
    );
    setupKnob(
      document.getElementById('aerationKnob'),
      document.getElementById('aerationValue'),
      'aeration', 1
    );

    // Listen for state updates from server (in case display also drives state somehow)
    ws.onmessage = (event) => {
      const s = JSON.parse(event.data);
      if (s.rpm !== undefined) {
        state.rpm = s.rpm;
        rpmSlider.value = s.rpm;
        rpmValue.textContent = s.rpm;
      }
    };
  </script>
</body>
</html>
