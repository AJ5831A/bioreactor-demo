<!DOCTYPE html>
<html>
<head>
  <title>Reactor Controls</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: fixed;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #0a0e14;
      color: #e0e0e0;
      font-family: -apple-system, sans-serif;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    h1 {
      font-size: 26px;
      font-weight: 300;
      color: #4dd0e1;
      letter-spacing: 2px;
    }
    .controlsGrid {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;
      gap: 20px;
      flex: 1;
    }
    .panel {
      background: #141a23;
      border: 1px solid #2a3441;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      user-select: none;
    }
    .label {
      font-size: 13px;
      letter-spacing: 3px;
      color: #6b7888;
      text-transform: uppercase;
    }
    .value {
      font-size: 52px;
      font-weight: 200;
      color: #4dd0e1;
      line-height: 1;
    }
    .unit { font-size: 16px; color: #6b7888; margin-left: 4px; }

    .sliderVisual {
      width: 100%;
      height: 14px;
      background: #1f2630;
      border-radius: 7px;
      position: relative;
      overflow: visible;
    }
    .sliderFill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: linear-gradient(90deg, #4dd0e1, #4dd0e1cc);
      border-radius: 7px;
    }
    .sliderThumb {
      position: absolute;
      top: 50%;
      width: 28px;
      height: 28px;
      background: #4dd0e1;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 20px rgba(77, 208, 225, 0.6);
    }
    .sliderVisual {
      cursor: pointer;
      padding: 12px 0;
      margin: -12px 0;
    }

    .buttonRow {
      display: flex;
      gap: 10px;
      width: 100%;
      justify-content: center;
    }
    .btn {
      background: #1f2630;
      border: 2px solid #2a3441;
      color: #4dd0e1;
      font-size: 22px;
      font-weight: 400;
      padding: 14px 0;
      border-radius: 12px;
      cursor: pointer;
      flex: 1;
      min-height: 60px;
      transition: background 0.1s, transform 0.1s;
      touch-action: manipulation;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active {
      background: #2a3441;
      transform: scale(0.96);
    }
    .btn.big {
      font-size: 26px;
      font-weight: 300;
    }

    .knobContainer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .knob {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #2a3441, #141a23);
      border: 3px solid #4dd0e1;
      position: relative;
      box-shadow: 0 0 30px rgba(77, 208, 225, 0.2);
      transition: transform 0.2s ease;
    }
    .knob::after {
      content: '';
      position: absolute;
      top: 8px;
      left: 50%;
      width: 4px;
      height: 26px;
      background: #4dd0e1;
      transform: translateX(-50%);
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <h1>BIOREACTOR CONTROLS</h1>

  <div class="controlsGrid">
    <div class="panel">
      <div class="label">RPM</div>
      <div class="value"><span id="rpmValue">200</span></div>
      <div class="sliderVisual">
        <div class="sliderFill" id="rpmFill"></div>
        <div class="sliderThumb" id="rpmThumb"></div>
      </div>
      <div class="buttonRow">
        <button class="btn" data-control="rpm" data-delta="-50">−50</button>
        <button class="btn" data-control="rpm" data-delta="-10">−10</button>
        <button class="btn" data-control="rpm" data-delta="10">+10</button>
        <button class="btn" data-control="rpm" data-delta="50">+50</button>
      </div>
    </div>

    <div class="panel">
      <div class="label">Viscosity</div>
      <div class="knobContainer">
        <div class="knob" id="viscosityKnob"></div>
        <div class="value"><span id="viscosityValue">1.0</span><span class="unit">cP</span></div>
      </div>
      <div class="buttonRow">
        <button class="btn big" data-control="viscosity" data-delta="-0.5">−</button>
        <button class="btn big" data-control="viscosity" data-delta="0.5">+</button>
      </div>
    </div>

    <div class="panel">
      <div class="label">Aeration</div>
      <div class="knobContainer">
        <div class="knob" id="aerationKnob"></div>
        <div class="value"><span id="aerationValue">0.5</span><span class="unit">vvm</span></div>
      </div>
      <div class="buttonRow">
        <button class="btn big" data-control="aeration" data-delta="-0.1">−</button>
        <button class="btn big" data-control="aeration" data-delta="0.1">+</button>
      </div>
    </div>
  </div>

  <script>
    const ws = new WebSocket(`ws://${location.host}`);
    let state = { rpm: 200, viscosity: 1.0, aeration: 0.5 };

    const limits = {
      rpm:       { min: 0,   max: 600, decimals: 0 },
      viscosity: { min: 0.5, max: 10,  decimals: 1 },
      aeration:  { min: 0,   max: 2,   decimals: 1 },
    };

    function sendState() {
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(state));
      }
    }

    function updateUI() {
      const rpmPct = (state.rpm - limits.rpm.min) / (limits.rpm.max - limits.rpm.min);
      document.getElementById('rpmFill').style.width = `${rpmPct * 100}%`;
      document.getElementById('rpmThumb').style.left = `${rpmPct * 100}%`;
      document.getElementById('rpmValue').textContent = Math.round(state.rpm);

      const visPct = (state.viscosity - limits.viscosity.min) / (limits.viscosity.max - limits.viscosity.min);
      document.getElementById('viscosityKnob').style.transform = `rotate(${-135 + visPct * 270}deg)`;
      document.getElementById('viscosityValue').textContent = state.viscosity.toFixed(1);

      const aerPct = (state.aeration - limits.aeration.min) / (limits.aeration.max - limits.aeration.min);
      document.getElementById('aerationKnob').style.transform = `rotate(${-135 + aerPct * 270}deg)`;
      document.getElementById('aerationValue').textContent = state.aeration.toFixed(1);
    }

    document.querySelectorAll('.btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const control = btn.dataset.control;
        const delta = parseFloat(btn.dataset.delta);
        const { min, max, decimals } = limits[control];

        let newValue = state[control] + delta;
        newValue = Math.max(min, Math.min(max, newValue));
        newValue = parseFloat(newValue.toFixed(decimals));

        state[control] = newValue;
        updateUI();
        sendState();
      });
    });

    ws.onmessage = (event) => {
      const s = JSON.parse(event.data);
      state = { ...state, ...s };
      updateUI();
    };

    // --- RPM slider drag (touch + mouse) ---
    const rpmSlider = document.querySelector('.sliderVisual');

    function rpmFromX(clientX) {
      const rect = rpmSlider.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      const { min, max, decimals } = limits.rpm;
      return parseFloat((min + pct * (max - min)).toFixed(decimals));
    }

    function applyRpm(clientX) {
      state.rpm = rpmFromX(clientX);
      updateUI();
      sendState();
    }

    rpmSlider.addEventListener('touchstart', (e) => { e.preventDefault(); applyRpm(e.touches[0].clientX); }, { passive: false });
    rpmSlider.addEventListener('touchmove',  (e) => { e.preventDefault(); applyRpm(e.touches[0].clientX); }, { passive: false });

    let mouseDown = false;
    rpmSlider.addEventListener('mousedown', (e) => { mouseDown = true; applyRpm(e.clientX); });
    window.addEventListener('mousemove', (e) => { if (mouseDown) applyRpm(e.clientX); });
    window.addEventListener('mouseup',   () => { mouseDown = false; });

    // --- Knob rotational drag (touch + mouse) ---
    function getAngleFromCenter(knob, clientX, clientY) {
      const rect = knob.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      return Math.atan2(clientY - cy, clientX - cx) * (180 / Math.PI);
    }

    function setupKnobDrag(knobId, control) {
      const knob = document.getElementById(knobId);
      let startAngle, startVal, dragging = false;

      function applyRotation(clientX, clientY) {
        const { min, max, decimals } = limits[control];
        let angleDelta = getAngleFromCenter(knob, clientX, clientY) - startAngle;
        // wrap angle delta to [-180, 180] to avoid jumps
        if (angleDelta > 180)  angleDelta -= 360;
        if (angleDelta < -180) angleDelta += 360;
        const valueDelta = (angleDelta / 270) * (max - min);
        const v = Math.max(min, Math.min(max, parseFloat((startVal + valueDelta).toFixed(decimals))));
        state[control] = v;
        updateUI();
        sendState();
      }

      knob.addEventListener('touchstart', (e) => {
        e.preventDefault();
        startAngle = getAngleFromCenter(knob, e.touches[0].clientX, e.touches[0].clientY);
        startVal = state[control];
      }, { passive: false });
      knob.addEventListener('touchmove', (e) => {
        e.preventDefault();
        applyRotation(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: false });

      knob.addEventListener('mousedown', (e) => {
        dragging = true;
        startAngle = getAngleFromCenter(knob, e.clientX, e.clientY);
        startVal = state[control];
      });
      window.addEventListener('mousemove', (e) => { if (dragging) applyRotation(e.clientX, e.clientY); });
      window.addEventListener('mouseup',   () => { dragging = false; });
    }

    setupKnobDrag('viscosityKnob', 'viscosity');
    setupKnobDrag('aerationKnob', 'aeration');

    updateUI();
</script>
</body>
</html>
